name: Deploy to hosting via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_PATH" ]; then
            echo "SSH secrets are not set yet, skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site with rsync
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT"
          if $SSH "$SSH_USER@$SSH_HOST" "command -v rsync" >/dev/null 2>&1; then
            rsync -avz \
              --exclude ".git/" --exclude ".github/" --exclude ".nojekyll" \
              -e "$SSH" ./ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
          else
            echo "rsync not available on server, using scp"
            $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$SSH_PATH/img'"
            scp -i ~/.ssh/deploy_key -P "$PORT" index.html "$SSH_USER@$SSH_HOST:$SSH_PATH/"
            scp -i ~/.ssh/deploy_key -P "$PORT" img/* "$SSH_USER@$SSH_HOST:$SSH_PATH/img/"
          fi
