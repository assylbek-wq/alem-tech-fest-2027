name: Deploy to hosting via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Folder on the FTP server that serves alemtechfest.kz
  DEPLOY_DIR: /httpdocs

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "FTP secrets are not set yet, skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Show server folders
        if: steps.check.outputs.ready == 'true'
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            set net:max-retries 3; set net:timeout 30;
            echo '--- /'; cls -1 /;
            echo '--- /httpdocs'; cls -1 /httpdocs;
            echo '--- /alemtechfest.kz'; cls -1 /alemtechfest.kz;
            bye" || true

      - name: Upload site
        if: steps.check.outputs.ready == 'true'
        run: |
          DIR="${FTP_DIR:-$DEPLOY_DIR}"
          echo "Deploying to $DIR"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            set net:max-retries 3; set net:timeout 30;
            mirror -R --verbose --no-perms --exclude-glob .git* --exclude-glob .github/ --exclude-glob .nojekyll ./ $DIR;
            bye"
